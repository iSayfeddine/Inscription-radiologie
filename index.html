<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tutorat en radiologie thoracique</title>
<style>
:root{box-sizing:border-box;--bg:#f6f4ef;--ink:#2f4a7a;--btn:#5883c2;--btn-h:#4670b0;--btn-t:#fff;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#161b26}}
:root[data-theme="dark"]{--bg:#161b26}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);font-family:"Trebuchet MS",Helvetica,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;gap:22px;padding:20px 16px 36px;min-height:100dvh;justify-content:center}
img{width:auto;max-width:100%;max-height:calc(100dvh - 170px);height:auto;border-radius:18px;box-shadow:0 8px 30px rgba(47,74,122,.25);display:block}
a.cta{display:inline-block;background:var(--btn);color:var(--btn-t);text-decoration:none;font-size:1.25rem;font-weight:700;padding:16px 44px;border-radius:999px;box-shadow:0 6px 0 #3a5c94;transition:transform .1s,box-shadow .1s,background .2s}
a.cta:hover{background:var(--btn-h)}
a.cta:active{transform:translateY(4px);box-shadow:0 2px 0 #3a5c94}
a.cta:focus-visible{outline:3px solid #b3d1fb;outline-offset:4px}
</style></head><body>
<img src="image.jpg" alt="Tutorat en radiologie thoracique en 5 séances : les fondamentaux, sémiologie radiologique, signes radiologiques majeurs, entraînement pratique, attestation de participation, accompagnement individuel à la dernière séance">

</body></html>
